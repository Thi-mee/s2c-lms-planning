name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: dotnet restore Variable.slnx --locked-mode
      - run: npm ci
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
      - run: bash scripts/dev.sh db
      - run: dotnet test Variable.slnx --no-restore --disable-build-servers -m:1
      - run: bash scripts/dev.sh migrate
      - run: bash scripts/dev.sh bootstrap
      - run: npx playwright install --with-deps chromium
        working-directory: src/web
      - run: npm run test:e2e
        working-directory: src/web
      - if: always()
        run: bash scripts/dev.sh stop-db
